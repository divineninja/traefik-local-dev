api:
  dashboard: true
  debug: true

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: traefik
  file:
    filename: /etc/traefik/traefik.yml
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: admin@local.test
      storage: /etc/ssl/traefik/acme.json
      httpChallenge:
        entryPoint: web

# TLS Configuration for local development
tls:
  certificates:
    - certFile: /etc/ssl/traefik/local.test.crt
      keyFile: /etc/ssl/traefik/local.test.key
      stores:
        - default
  stores:
    default:
      defaultCertificate:
        certFile: /etc/ssl/traefik/local.test.crt
        keyFile: /etc/ssl/traefik/local.test.key

# Global redirect to https
http:
  middlewares:
    default-headers:
      headers:
        frameDeny: true
        sslRedirect: true
        browserXssFilter: true
        contentTypeNosniff: true
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 31536000
    
    secure-headers:
      headers:
        accessControlAllowMethods:
          - GET
          - OPTIONS
          - PUT
        accessControlMaxAge: 100
        hostsProxyHeaders:
          - "X-Forwarded-Host"
        referrerPolicy: "same-origin"

# Logging
log:
  level: INFO
  filePath: /var/log/traefik/traefik.log

accessLog:
  filePath: /var/log/traefik/access.log